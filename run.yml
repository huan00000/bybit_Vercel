name: Deploy Docker bot
on:
  workflow_dispatch:
    inputs:
      digest:
        description: 'Image digest from build summary (sha256:...)'
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: telegram-bot-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, tg-bot]
    environment: production
    env:
      BOT_ENV_FILE: /opt/tg-bybit-bot/.env
      COMPOSE_PROJECT_NAME: tg-bybit-bot
      DOCKER_CONFIG: ${{ runner.temp }}/tg-bot-docker-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment configuration
        shell: bash
        env:
          DIGEST: ${{ inputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          test -r "$BOT_ENV_FILE"
          docker compose version
          echo "BOT_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}@$DIGEST" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull and deploy
        shell: bash
        run: |
          set -euo pipefail
          docker compose pull bot
          docker compose up -d --no-build --wait --wait-timeout 180 bot
          docker compose ps
