services:
  bot:
    image: ${BOT_IMAGE:-tg-bybit-bot:local}
    build: .
    env_file:
      - path: ${BOT_ENV_FILE:-.env}
        format: raw
    restart: unless-stopped
    init: true
    stop_grace_period: 60s
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - bot-data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  bot-data:
